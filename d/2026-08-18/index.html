<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>人格阴影测试</title>
<style>
  :root {
    --bg: #faf9f6;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6b7280;
    --accent: #4a69bd;
    --accent-light: #6a89cc;
    --accent-glass: rgba(74,105,189,0.12);
    --border: #e5e7eb;
    --shadow: 0 2px 16px rgba(0,0,0,0.06);
    --radius: 16px;
    --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  [data-theme="dark"] {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --text: #e5e7eb;
    --text-secondary: #9ca3af;
    --border: #2d2d44;
    --shadow: 0 2px 16px rgba(0,0,0,0.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background var(--transition), color var(--transition);
    overflow-x: hidden;
  }

  /* ── Theme toggle ── */
  #theme-toggle {
    position: fixed; top: 16px; right: 16px; z-index: 100;
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--surface);
    font-size: 18px; cursor: pointer;
    box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
  }
  #theme-toggle:hover { transform: scale(1.08); }

  /* ── Section visibility ── */
  .section { display: none; }
  .section.active { display: block; animation: fadeSlideIn 0.5s ease; }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Landing Page ── */
  #landing {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 32px 20px;
    text-align: center;
  }
  #landing .icon { font-size: 64px; margin-bottom: 20px; }
  #landing h1 { font-size: 2rem; font-weight: 800; margin-bottom: 12px; line-height: 1.3; }
  #landing .tagline { font-size: 1.05rem; color: var(--text-secondary); max-width: 380px; margin-bottom: 32px; line-height: 1.6; }
  #landing .meta { display: flex; gap: 24px; margin-bottom: 40px; }
  #landing .meta-item { text-align: center; }
  #landing .meta-item .num { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  #landing .meta-item .label { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }
  .btn-start {
    display: inline-block; padding: 14px 48px;
    background: var(--accent); color: #fff;
    font-size: 1.1rem; font-weight: 600;
    border: none; border-radius: 50px;
    cursor: pointer;
    transition: all var(--transition);
    letter-spacing: 1px;
    box-shadow: 0 4px 20px rgba(74,105,189,0.12);
  }
  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(74,105,189,0.12); }

  /* ── Test Section ── */
  #test-section { max-width: 600px; margin: 0 auto; padding: 20px; }
  .progress-wrap { margin-bottom: 32px; }
  .progress-info { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-secondary); }
  .progress-bar {
    height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; background: var(--accent); border-radius: 3px;
    transition: width 0.5s ease;
  }
  .question-card {
    background: var(--surface); border-radius: var(--radius);
    padding: 32px 24px; box-shadow: var(--shadow);
    border: 1px solid var(--border);
    animation: fadeSlideIn 0.4s ease;
    transition: background var(--transition), border-color var(--transition);
  }
  .question-card .q-num { font-size: 0.85rem; color: var(--accent); font-weight: 600; margin-bottom: 16px; }
  .question-card .q-text { font-size: 1.15rem; line-height: 1.7; margin-bottom: 28px; font-weight: 500; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option-btn {
    display: block; width: 100%; padding: 16px 20px;
    background: var(--bg); border: 2px solid var(--border);
    border-radius: 12px; font-size: 0.95rem; text-align: left;
    cursor: pointer; font-family: var(--font);
    transition: all 0.2s ease;
    color: var(--text);
  }
  .option-btn:hover { border-color: var(--accent-light); background: var(--accent-glass); }
  .option-btn.selected { border-color: var(--accent); background: var(--accent-glass); font-weight: 500; }
  .nav-btns { display: flex; justify-content: space-between; margin-top: 24px; gap: 12px; }
  .btn-nav {
    padding: 12px 28px; border-radius: 50px; font-size: 0.95rem;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); cursor: pointer; font-family: var(--font);
    transition: all var(--transition);
  }
  .btn-nav:hover { border-color: var(--accent); }
  .btn-nav:disabled { opacity: 0.4; cursor: default; }
  .btn-nav.primary { background: var(--accent); color: #fff; border: none; }

  /* ── Results Section ── */
  #results-section { max-width: 640px; margin: 0 auto; padding: 20px; }
  .result-header { text-align: center; margin-bottom: 32px; }
  .result-header h1 { font-size: 1.6rem; font-weight: 800; }
  .result-header .personality-badge {
    display: inline-block; margin-top: 16px;
    padding: 10px 28px; background: var(--accent-glass);
    border: 2px solid var(--accent); border-radius: 50px;
    font-size: 1.4rem; font-weight: 700; color: var(--accent);
  }
  .chart-wrap { max-width: 380px; margin: 0 auto 40px; }
  .analysis-cards { display: flex; flex-direction: column; gap: 16px; }
  .analysis-card {
    background: var(--surface); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
    border: 1px solid var(--border);
    transition: background var(--transition), border-color var(--transition);
  }
  .analysis-card h3 { font-size: 1rem; margin-bottom: 4px; color: var(--accent); }
  .analysis-card .score { font-size: 2rem; font-weight: 700; margin-bottom: 12px; }
  .analysis-card .detail { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.6; }
  .analysis-card .detail strong { color: var(--text); display: block; margin-top: 10px; }
  .btn-share {
    display: block; margin: 32px auto; padding: 12px 40px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 50px; font-size: 0.95rem; cursor: pointer;
    font-family: var(--font); color: var(--text);
    transition: all var(--transition);
  }
  .btn-share:hover { border-color: var(--accent); color: var(--accent); }
  .footer { text-align: center; padding: 24px; font-size: 0.8rem; color: var(--text-secondary); }

  @media (max-width: 480px) {
    #landing h1 { font-size: 1.5rem; }
    #landing .meta { gap: 16px; }
    .question-card { padding: 24px 16px; }
  }
</style>
</head>
<body>

<button id="theme-toggle" onclick="toggleTheme()" title="切换主题">🌓</button>

<!-- ═══ Landing Page ═══ -->
<div id="landing" class="section active">
  <div class="icon">🌑🗝️</div>
  <h1>人格阴影测试</h1>
  <p class="tagline">你藏起来的那部分自己，一直在替你承受</p>
  <div class="meta">
    <div class="meta-item"><div class="num" id="total-questions">60</div><div class="label">道情境题</div></div>
    <div class="meta-item"><div class="num">6</div><div class="label">维度分析</div></div>
    <div class="meta-item"><div class="num">~8</div><div class="label">分钟</div></div>
  </div>
  <button class="btn-start" id="btn-start-new" onclick="startTest(false)">开始测试</button>
  <button class="btn-start" id="btn-continue" onclick="startTest(true)" style="display:none;background:var(--surface);color:var(--accent);border:2px solid var(--accent);">继续上次答题</button>
  <div id="saved-info" style="margin-top:12px;font-size:0.8rem;color:var(--text-secondary);display:none;"></div>
</div>

<!-- Toast -->
<div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);border:1px solid var(--border);padding:10px 24px;border-radius:50px;font-size:0.85rem;box-shadow:var(--shadow);z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;">已保存</div>

<!-- ═══ Test Section ═══ -->
<div id="test-section" class="section">
  <div class="progress-wrap">
    <div class="progress-info"><span id="progress-label">第 1 题 / 共 60 题</span><span id="progress-pct">0%</span></div>
    <div class="progress-bar"><div class="fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="question-card" id="question-card">
    <div class="q-num" id="q-num"></div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="q-options"></div>
  </div>
  <div class="nav-btns">
    <button class="btn-nav" id="btn-prev" onclick="prevQuestion()" disabled>← 上一题</button>
    <button class="btn-nav primary" id="btn-next" onclick="nextQuestion()">下一题 →</button>
  </div>
</div>

<!-- ═══ Results Section ═══ -->
<div id="results-section" class="section">
  <div class="result-header">
    <h1>人格阴影测试 — 你的结果</h1>
    <div class="personality-badge" id="personality-badge">ENFP</div>
    <p style="margin-top:8px;color:var(--text-secondary);font-size:0.9rem;" id="personality-desc"></p>
  </div>
  <div class="chart-wrap"><canvas id="radarChart"></canvas></div>
  <div class="analysis-cards" id="analysis-cards"></div>
  <button class="btn-share" onclick="restartTest()">再做一次</button>
</div>

<div class="footer">仅供娱乐</div>

  const dimensionDefs = [{"id": "D1", "name": "嫉妒感", "description": "当他人拥有你渴望却未拥有的东西时，内心泛起的酸涩与不甘的程度", "high_label": "暗流涌动", "low_label": "心若止水"}, {"id": "D2", "name": "胜负欲", "description": "在竞争情境下被激发的求胜渴望，以及无法接受失败的敏感程度", "high_label": "寸土必争", "low_label": "云淡风轻"}, {"id": "D3", "name": "索取倾向", "description": "在关系中习惯性期待他人付出，而非主动给予的潜意识倾向", "high_label": "习惯被爱", "low_label": "乐于给予"}, {"id": "D4", "name": "猜疑心", "description": "对他人动机和话语的信任程度，以及预设防备立场的倾向", "high_label": "防微杜渐", "low_label": "赤诚相见"}, {"id": "D5", "name": "伪装度", "description": "在不同社交场合戴上面具、隐藏真实情绪和想法的频率", "high_label": "千面演员", "low_label": "始终如一"}, {"id": "D6", "name": "攻击性", "description": "面对冒犯或冲突时，内心升起的反击冲动和言语锋利程度", "high_label": "锋芒毕露", "low_label": "温润如玉"}];
  const personalityMapping = {"classification_type": "shadow_level", "primary_tag": "高阴影型", "tag_name": "暗影行者", "community_description": "和你一样的暗影行者，在人群中占比约15%，你们通常对自己内心的暗面有着敏锐的感知力，也愿意承认它的存在。你们不是没有嫉妒心或攻击性，而是这些情绪在你们身上格外鲜明——当它们浮现时，你们会清晰地感受到那股能量。这种敏锐不是缺陷，而是一种深度：你们能看透人际间的伪装，也对自己有着近乎苛刻的诚实。你们可能常被误解为冷漠或算计，但事实上，你们只是不愿意粉饰太平。暗影行者的优势在于，你们不会在暗处被自己的影子绊倒——你们知道它在哪里，所以能更有意识地选择何时释放、何时收敛。需要注意的可能是，当你们习惯性地用猜疑或胜负欲来保护自己时，偶尔会推开那些真正想靠近的人。你们的成长方向，是学会让这份对暗面的觉察，成为理解他人的桥梁，而不是隔绝自己的高墙。你不孤单，很多人正和你一样，在学着与自己的影子共舞。", "possible_tags": ["高阴影型", "中阴影型", "低阴影型", "混合型"], "dominant_dim": "D1"};
  const analysisData = [{"dim_id": "D1", "核心特质": "你像一潭深水，表面平静，底下却暗流涌动。看到同事升职、朋友晒幸福，你嘴上说着‘挺好的’，心里却泛起细密的酸涩。这种嫉妒不是恶意，而是你对自己不够好的隐秘指控。你习惯比较，尤其在熟悉的社群里，怕被落下，又不敢承认。你把这股劲藏得很深，深到连自己都骗过，但它却悄悄消耗着你的能量。", "潜在盲点": "你误以为‘不嫉妒’就是高尚，于是压抑真实感受。可那些没说出口的酸涩，会变成对别人的挑剔、对关系的疏离，甚至半夜反复咀嚼别人的成功。你害怕暴露脆弱，怕被社群看轻，于是用‘无所谓’当盔甲。但这份克制，反而让你离真实更远——你既没真正祝福别人，也没真正放过自己。", "专属建议": "试着把嫉妒当成雷达，它指向你真正渴望的方向。下次心口发紧时，写下‘我羡慕他哪一点’，然后问自己‘我能为自己做点什么’。在信任的社群里，找一个人说出你的酸涩，你会发现对方也有同款。把比较换成学习，把暗涌变成行动力。心若止水不是无感，而是看清自己后，依然愿意为自己鼓掌。"}, {"dim_id": "D2", "核心特质": "你像自带雷达的猎手，牌局里每张未出的K、群聊中每条未回的@、赛道上每次0.1秒的差距，都会瞬间点燃你的专注。你享受把模糊规则变成清晰战场的快感，哪怕只是抢到会议室最后一杯咖啡，也能在心底升起微小胜利的旗帜。这份寸土必争的敏锐，让伙伴觉得你可靠，也让对手不敢轻慢——你天然是团队里那个守住底线、推动目标的人。", "潜在盲点": "你的云淡风轻有时是盔甲，但低分端更可能是害怕暴露渴望后的失落。当你在游戏里故意放水、在讨论中沉默退让，表面洒脱，内心却可能悄悄记账。这种‘不争’容易让伙伴误读为不在乎，反而稀释了你的存在感。更危险的是，你偶尔把‘输赢’等同于‘被爱’，于是回避竞争，却错过了并肩作战时那种热腾腾的归属感。", "专属建议": "试着把胜负欲从‘结果’挪到‘过程’：下次团建玩桌游，主动喊出‘我要认真赢’，然后笑着接受输局。你会发现，真正让人靠近的，不是永远云淡风轻，而是你愿意为在乎的事脸红心跳。每周留一次‘小赌注’——比如跟朋友打赌谁先完成报告，输的人请奶茶。这能训练你安全地释放渴望，也让伙伴看见你鲜活的一面，反而更敢与你交心。"}, {"dim_id": "D3", "核心特质": "你像一株被精心浇灌的植物，习惯性地接收阳光与水分，在亲密关系里默认他人应主动付出关怀。你擅长用柔软的姿态吸引照顾者，聚会时总有人为你留座、递茶、记得你的忌口。你并非自私，而是将‘被爱’内化为呼吸般的自然节奏，甚至察觉不到自己正悄然把索取当作爱的证明。这种模式让你在群体中如鱼得水，却也让你的幸福感依赖外界的持续供给，仿佛情绪的风向标始终握在他人手中。", "潜在盲点": "你很少主动询问‘你需要什么’，因为你的注意力早已习惯性锚定在自己的感受缺口上。当朋友倾诉疲惫时，你可能下意识把话题转回自己的压力，并非冷漠，而是你的情感雷达天然朝向接收端。更隐蔽的是，你常把别人的付出合理化——‘他反正喜欢照顾人’，却忽略对方也可能在等待回应。长此以往，你会陷入‘越索取越空虚’的循环，因为真正的连接需要双向流动，而单向的给予终会枯竭，连社群中的温暖也会逐渐变成你愧疚的底色。", "专属建议": "试着每周做一次‘反向给予实验’：提前观察某位常付出者的需求，比如主动帮同事带咖啡、记住朋友的过敏药，或在群里第一个回应别人的求助。重点不是做大事，而是训练自己把注意力从‘我缺什么’转向‘我能补什么’。当你感到被爱时，刻意停顿三秒，问自己：‘此刻我能回赠什么？哪怕一个拥抱或一句具体的感谢。’你会在给予中意外发现，原来主动付出带来的掌控感与归属感，比被动接收更让人踏实——爱不是填满自己的容器，而是点燃彼此的火把。"}, {"dim_id": "D4", "核心特质": "你像一台高精度雷达，在人群里自动扫描微表情、语气停顿和承诺的缝隙。朋友随口一句“改天约”，你会默默记下时间；伴侣晚归十分钟，你已推演三种可能。这种防微杜渐让你极少被辜负，却也让你在聚会中即便笑着，心底仍留着一块“待验证”的缓冲区。你并非不愿信任，而是相信只有掌握细节，才能守住关系的安全线。", "潜在盲点": "你的“先见之明”常被误读为疏离——当同事分享秘密时，你追问“证据呢”的瞬间，空气会突然安静。过度防御让你把善意也当成待拆的包裹，甚至推开那些真正赤诚的人。你习惯用逻辑拆解情感，却忘了有些真心经不起反复钻孔。最隐蔽的代价是：你躲过了小概率的背叛，却也错过了大概率的热烈拥抱。", "专属建议": "试着每周做一次“信任实验”：对亲近的人，把“真的吗”换成“我相信你”，并忍受那一点不确定带来的痒。当怀疑升起时，先问自己“最坏的结果我能承受吗”，再决定是否启动调查模式。加入一个彼此不设防的小团体（比如读书会或运动队），观察那些“傻气”的坦诚如何换来更深的安全感。你会发现，真正的防微杜渐，是允许裂缝存在，仍选择并肩。"}, {"dim_id": "D5", "核心特质": "你像一面精心打磨的镜子，在不同场合折射出恰到好处的光——同事眼中的可靠搭档，朋友群里的幽默担当，家人面前乖巧懂事。这种切换近乎本能，连你自己都分不清哪张脸更真实。你享受掌控他人期待的成就感，仿佛戴上无数面具后，反而拥有了最安全的藏身之处。在社群中你是公认的‘气氛调节器’，但深夜独处时，你常对着镜中陌生的自己发问：那个被所有人喜欢的‘我’，到底是谁？", "潜在盲点": "你的伪装太精密，以至于连亲密关系都成了表演舞台。当伴侣说‘你变了’时，你第一反应不是反思，而是立刻调整下一幕剧本。长期下来，你开始恐惧卸下面具的瞬间——比如醉酒后的失态、崩溃时的失言，这些‘破绽’让你感到羞耻。你在社群中越是受欢迎，就越害怕被看穿，于是不断加厚伪装，最终陷入‘越被爱越孤独’的循环。你甚至会用‘大家不都这样吗’来麻痹自己的不安，却忽略了内心早已发出的求救信号。", "专属建议": "试着在安全的小社群（比如仅3人的挚友群）里，每周主动暴露一次‘不完美’：抱怨工作、承认嫉妒、拒绝帮忙。你会发现，当你说‘我今天不想装热情’时，真正在意你的人反而松了口气。把‘伪装度’从生存技能降级为社交调味料——保留基本礼貌，但允许情绪有毛边。记录每次摘下面具后的真实感受，连续21天，你会重新定义‘被喜欢’与‘被接纳’的区别。记住，真正的社群归属感，是有人看过你最狼狈的样子，依然选择坐在你身边。"}, {"dim_id": "D6", "核心特质": "你的攻击性如刀锋出鞘，在辩论中直击要害，在竞争里先声夺人。你不屑迂回，享受观点碰撞的火花，常成为团队里那个敢拍桌子的破局者。这种锋芒让你在压力下反而亢奋，像狼群中的头领，用直接和果敢赢得敬畏。你不需要被喜欢，你需要被看见，而黑暗中的同伴，正因你的锐利而找到方向。", "潜在盲点": "你的锋利常误伤盟友——一句‘你太弱了’可能让协作伙伴暗自退缩。你误以为只有压倒性强势才能证明价值，却忽略了亲密关系需要卸甲时刻。在深夜复盘时，你是否感到孤独？那些被你刺痛的灵魂，渐渐学会绕开你行走。攻击性成了你的铠甲，也成了你的牢笼，让你在证明自己强大的同时，错过了真正柔软的联结。", "专属建议": "尝试把攻击性转化为‘定向突破力’：在会议中先肯定对方再提出异议，把‘你错了’换成‘我有个更险的招’。每周刻意留出两小时，参与非竞技性社群活动（如桌游合作局），练习倾听而不反驳。你会发现，当锋芒对准共同目标而非他人软肋时，你不仅赢得战斗，更赢得并肩的战友——真正的力量，是能收放自如的刀鞘。"}];
  const STORAGE_KEY = 'xhs_test_' + (personalityMapping.classification_type || 'test') + '_' + questions.length;

  // ═══ State ═══
  let currentQ = 0;
  const answers = {};
  let radarChart = null;

  // ═══ Save/Load ═══
  function saveProgress() {
    var data = {
      answers: answers,
      currentQ: currentQ,
      savedAt: new Date().toISOString(),
      topic: '人格阴影测试',
    };
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch(e) {}
  }

  function loadProgress() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      return data;
    } catch(e) {
      return null;
    }
  }

  function clearProgress() {
    try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    setTimeout(function() { t.style.opacity = '0'; }, 1800);
  }

  // ═══ Theme ═══
  function toggleTheme() {
    var html = document.documentElement;
    var cur = html.getAttribute('data-theme');
    html.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  }

  // ═══ Navigation ═══
  function showSection(id) {
    document.querySelectorAll('.section').forEach(function(s) { s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
    if (document.activeElement && document.activeElement.blur) { document.activeElement.blur(); }
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function startTest(restore) {
    if (restore) {
      var saved = loadProgress();
      if (saved && saved.answers) {
        Object.assign(answers, saved.answers);
        currentQ = saved.currentQ || 0;
      }
    } else {
      clearProgress();
    }
    showSection('test-section');
    renderQuestion();
  }

  function restartTest() {
    Object.keys(answers).forEach(function(k) { delete answers[k]; });
    clearProgress();
    if (radarChart) { radarChart.destroy(); radarChart = null; }
    currentQ = 0;
    showSection('landing');
  }

  // ═══ Question Rendering ═══
  function renderQuestion() {
    if (currentQ >= questions.length) {
      clearProgress();
      calculateResults();
      return;
    }
    var q = questions[currentQ];
    document.getElementById('q-num').textContent = '第 ' + (currentQ + 1) + ' 题';
    document.getElementById('q-text').textContent = q.text;

    var optsDiv = document.getElementById('q-options');
    optsDiv.innerHTML = '';
    q.options.forEach(function(opt, idx) {
      var btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt.label + '. ' + opt.text;
      if (answers[q.id] === idx) { btn.classList.add('selected'); }
      btn.onclick = function() {
        answers[q.id] = idx;
        optsDiv.querySelectorAll('.option-btn').forEach(function(b) { b.classList.remove('selected'); });
        btn.classList.add('selected');
        saveProgress();
      };
      optsDiv.appendChild(btn);
    });

    var pct = Math.round((currentQ / questions.length) * 100);
    document.getElementById('progress-label').textContent = '第 ' + (currentQ + 1) + ' 题 / 共 ' + questions.length + ' 题';
    document.getElementById('progress-pct').textContent = pct + '%';
    document.getElementById('progress-fill').style.width = pct + '%';

    document.getElementById('btn-prev').disabled = (currentQ === 0);
    var btnNext = document.getElementById('btn-next');
    btnNext.textContent = (currentQ === questions.length - 1) ? '查看结果 →' : '下一题 →';
    btnNext.onclick = function() { nextQuestion(); };

    if (currentQ > 0) { saveProgress(); }
    
  }

  function nextQuestion() {
    var q = questions[currentQ];
    if (answers[q.id] === undefined) {
      var card = document.getElementById('question-card');
      card.style.animation = 'none'; card.offsetHeight; card.style.animation = 'shake 0.4s ease';
      return;
    }
    currentQ++;
    if (currentQ >= questions.length) {
      calculateResults();
    } else {
      renderQuestion();
    }
  }

  function prevQuestion() {
    if (currentQ > 0) { currentQ--; renderQuestion(); }
  }

  // ═══ Keyframes ═══
  var shakeStyle = document.createElement('style');
  shakeStyle.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}';
  document.head.appendChild(shakeStyle);

  // ═══ Results ═══
  function calculateResults() {
    showSection('results-section');

    // Sum scores
    var rawScores = {};
    dimensionDefs.forEach(function(d) { rawScores[d.id] = 0; });
    questions.forEach(function(q) {
      var optIdx = answers[q.id];
      if (optIdx !== undefined && q.options[optIdx] && q.options[optIdx].scores) {
        var scores = q.options[optIdx].scores;
        Object.keys(scores).forEach(function(dim) { rawScores[dim] = (rawScores[dim] || 0) + scores[dim]; });
      }
    });

    // Normalize 0-100 (dynamic scoring: max = round(100/question_count))
    var maxPerQ = 2;
    var maxPossible = questions.length * maxPerQ;
    var normalized = {};
    Object.keys(rawScores).forEach(function(dim) {
      var pct = Math.round((rawScores[dim] / Math.max(1, maxPossible)) * 100);
      normalized[dim] = Math.min(100, pct);
    });

    // Radar chart
    var ctx = document.getElementById('radarChart').getContext('2d');
    if (radarChart) { radarChart.destroy(); }
    var accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    radarChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: dimensionDefs.map(function(d) { return d.name; }),
        datasets: [{
          label: '你的得分',
          data: dimensionDefs.map(function(d) { return normalized[d.id]; }),
          backgroundColor: accent + '33',
          borderColor: accent,
          borderWidth: 2.5,
          pointBackgroundColor: accent,
          pointRadius: 5,
          pointHoverRadius: 7,
          tension: 0.2,
        }]
      },
      options: {
        responsive: true,
        scales: { r: { beginAtZero: true, max: 100, ticks: { stepSize: 20, backdropColor: 'transparent', font: { size: 11 } } } },
        plugins: { legend: { display: false } }
      }
    });

    // Personality badge — computed from highest dimension score
    var isMBTI = personalityMapping.classification_type === 'mbti';
    var tag = personalityMapping.primary_tag || 'N/A';

    if (isMBTI) {
      // Legacy MBTI: use rules {E: "D1>50", N: "D2>50", ...}
      var rules = personalityMapping.rules || {};
      var parts = [];
      if (rules.E) { var m = rules.E.match(/D(\d+).*?(\d+)/); parts.push(normalized['D'+m[1]] >= parseInt(m[2]) ? 'E' : 'I'); }
      if (rules.N) { var m = rules.N.match(/D(\d+).*?(\d+)/); parts.push(normalized['D'+m[1]] >= parseInt(m[2]) ? 'N' : 'S'); }
      if (rules.T) { var m = rules.T.match(/D(\d+).*?(\d+)/); parts.push(normalized['D'+m[1]] >= parseInt(m[2]) ? 'T' : 'F'); }
      if (rules.J) { var m = rules.J.match(/D(\d+).*?(\d+)/); parts.push(normalized['D'+m[1]] >= parseInt(m[2]) ? 'J' : 'P'); }
      tag = parts.length >= 4 ? parts.join('') : tag;
    } else {
      // Non-MBTI: find the user's ACTUAL highest-scoring dimension, use corresponding tag
      var possibleTags = personalityMapping.possible_tags || [];
      var dominantDim = personalityMapping.dominant_dim || '';

      // Find which dimension has the highest normalized score
      var bestDim = dominantDim;
      var bestScore = -1;
      dimensionDefs.forEach(function(d) {
        var s = normalized[d.id] || 0;
        if (s > bestScore) { bestScore = s; bestDim = d.id; }
      });

      if (possibleTags.length > 0 && bestDim) {
        // Map by index: D1→tag[0], D2→tag[1], etc.
        var dimIdx = -1;
        dimensionDefs.forEach(function(d, i) { if (d.id === bestDim) dimIdx = i; });
        if (dimIdx >= 0 && dimIdx < possibleTags.length) {
          tag = possibleTags[dimIdx];
        }
      }

      if (!tag || tag === personalityMapping.primary_tag) {
        // Fallback: use the primary_tag
        tag = personalityMapping.primary_tag || tag;
      }
    }

    var tagName = personalityMapping.tag_name || tag;
    document.getElementById('personality-badge').textContent = tag;
    document.getElementById('personality-desc').textContent = tagName + ' · ' + (personalityMapping.community_description || '');

    // Analysis cards — use LLM-generated rich analysis
    var cardsDiv = document.getElementById('analysis-cards');
    cardsDiv.innerHTML = '';
    var analysisMap = {};
    if (Array.isArray(analysisData)) {
      analysisData.forEach(function(a) { analysisMap[a.dim_id] = a; });
    }
    dimensionDefs.forEach(function(dim) {
      var score = normalized[dim.id];
      var a = analysisMap[dim.id] || {};
      var core = a['核心特质'] || (score >= 50 ? '你偏向' + (dim.high_label || '高') + '型表达。' : '你偏向' + (dim.low_label || '低') + '型表达。');
      var blind = a['潜在盲点'] || '任何性格倾向都是一体两面，优势的背面就是盲点。';
      var advice = a['专属建议'] || '认识自己只是第一步，行动才能带来改变。';

      var card = document.createElement('div');
      card.className = 'analysis-card';
      card.innerHTML = '<h3>' + dim.name + '</h3>'
        + '<div class="score">' + score + '<span style="font-size:0.5em;color:var(--text-secondary)"> / 100</span></div>'
        + '<div class="detail">'
        + '<strong>🔍 核心特质</strong><p>' + core + '</p>'
        + '<strong>⚠️ 潜在盲点</strong><p>' + blind + '</p>'
        + '<strong>💡 专属建议</strong><p>' + advice + '</p>'
        + '</div>';
      cardsDiv.appendChild(card);
    });
  }

  // ═══ Init ═══
  document.getElementById('total-questions').textContent = questions.length;

  // Check for saved progress
  (function() {
    var saved = loadProgress();
    if (saved && saved.answers && Object.keys(saved.answers).length > 0) {
      var doneCount = Object.keys(saved.answers).length;
      document.getElementById('btn-continue').style.display = 'inline-block';
      document.getElementById('saved-info').style.display = 'block';
      document.getElementById('saved-info').textContent = '上次已完成 ' + doneCount + '/' + questions.length + ' 题，进度已自动保存';
    }
  })();
</script>
</body>
</html>
