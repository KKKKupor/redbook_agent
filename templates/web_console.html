<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>小红书测试题生成台</title>
<style>
:root {
  /* Claude design tokens (claude/DESIGN.md) */
  --canvas: #faf9f5;
  --surface-card: #efe9de;
  --surface-soft: #f5f0e8;
  --surface-cream-strong: #e8e0d2;
  --surface-dark: #181715;
  --surface-dark-elevated: #252320;
  --surface-dark-soft: #1f1e1b;
  --hairline: #e6dfd8;
  --hairline-soft: #ebe6df;
  --hairline-dark: rgba(250, 249, 245, 0.08);
  --ink: #141413;
  --body: #3d3d3a;
  --body-strong: #252523;
  --muted: #6c6a64;
  --muted-soft: #8e8b82;
  --primary: #cc785c;
  --primary-active: #a9583e;
  --primary-disabled: #e6dfd8;
  --on-primary: #ffffff;
  --on-dark: #faf9f5;
  --on-dark-soft: #a09d96;
  --teal: #5db8a6;
  --amber: #e8a55a;
  --success: #5db872;
  --warning: #d4a017;
  --error: #c64545;
  --font-display: "Tiempos Headline", "Cormorant Garamond", "EB Garamond",
                  Georgia, "Songti SC", "STSong", serif;
  --font-sans: "StyreneB", Inter, -apple-system, BlinkMacSystemFont,
               "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", "Cascadia Code",
               Consolas, "Liberation Mono", monospace;
  --radius-btn: 8px;
  --radius-card: 12px;
  --shadow-soft: 0 1px 3px rgba(20, 20, 19, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.55;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ---- brand bar (top-nav: cream, 64px, hairline bottom) ---- */
.brand {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  padding: 0 24px;
  border-bottom: 1px solid var(--hairline);
  background: var(--canvas);
}
.brand-title {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 400;
  letter-spacing: -0.3px;
  color: var(--ink);
}
.brand-status {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 13px;
}
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muted-soft);
  flex: none;
}
.status-dot.running {
  background: var(--teal);
  animation: pulse 1.2s ease-out infinite;
}

/* ---- thread (cream canvas, editorial pacing) ---- */
.thread {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 32px 16px 24px;
}
.thread > * {
  width: 100%;
  max-width: 760px;
  margin-left: auto;
  margin-right: auto;
}
.thread::-webkit-scrollbar { width: 10px; }
.thread::-webkit-scrollbar-track { background: transparent; }
.thread::-webkit-scrollbar-thumb {
  background: var(--hairline);
  border-radius: 5px;
  border: 2px solid var(--canvas);
}
.thread::-webkit-scrollbar-thumb:hover { background: var(--muted-soft); }

/* ---- empty state (serif editorial headline) ---- */
.empty { text-align: center; padding: 96px 16px 48px; }
.empty-title {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 400;
  letter-spacing: -0.5px;
  line-height: 1.15;
  color: var(--ink);
}
.empty-sub { margin-top: 10px; font-size: 14px; color: var(--muted); }
.chips {
  margin-top: 28px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}
.chip {
  background: var(--surface-card);
  color: var(--body);
  border: 1px solid var(--hairline-soft);
  border-radius: 9999px;
  padding: 7px 16px;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: background-color 150ms ease-out, color 150ms ease-out;
}
.chip:hover { background: var(--surface-cream-strong); color: var(--ink); }

/* ---- user message (cream card) ---- */
.msg-user { text-align: right; }
.bubble-user {
  display: inline-block;
  text-align: left;
  background: var(--surface-card);
  border: 1px solid var(--hairline-soft);
  border-radius: var(--radius-card);
  border-bottom-right-radius: 4px;
  padding: 10px 16px;
  font-size: 14px;
  color: var(--body-strong);
  max-width: 80%;
  word-break: break-word;
}

/* ---- round / agent cards (dark code-window product surfaces) ---- */
.round { display: flex; flex-direction: column; gap: 12px; }

.agent-card {
  background: var(--surface-dark);
  border-radius: var(--radius-card);
  overflow: hidden;
}

.agent-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
}
.status-light {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muted-soft);
  flex: none;
  transition: background-color 150ms ease-out;
}
.agent-card.running .status-light {
  background: var(--teal);
  animation: pulse 1.2s ease-out infinite;
}
.agent-card.done .status-light { background: var(--success); }
.agent-card.failed .status-light { background: var(--error); }

.agent-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--on-dark);
}
.agent-elapsed {
  margin-left: auto;
  font-size: 12px;
  color: var(--on-dark-soft);
  font-variant-numeric: tabular-nums;
}

/* 流式文本:深色卡内的 inner code block(surface-dark-soft) */
.agent-stream {
  display: none;
  background: var(--surface-dark-soft);
  margin: 0 20px 20px;
  border-radius: var(--radius-btn);
  padding: 12px 16px;
  font-family: var(--font-mono);
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--on-dark);
  white-space: pre-wrap;
  word-break: break-word;
}
.agent-card.has-stream .agent-stream { display: block; }
.caret {
  display: inline-block;
  width: 7px;
  height: 1em;
  margin-left: 1px;
  vertical-align: -1px;
  background: var(--amber);
  animation: blink 1s step-end infinite;
}

/* ---- collapsible summary (dark card inner chrome) ---- */
.summary { display: none; border-top: 1px solid var(--hairline-dark); }
.agent-card.done .summary { display: block; }
.summary > summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  font-size: 12px;
  color: var(--on-dark-soft);
  cursor: pointer;
  user-select: none;
  transition: color 150ms ease-out;
}
.summary > summary:hover { color: var(--on-dark); }
.summary > summary::-webkit-details-marker { display: none; }
.summary > summary::before {
  content: "";
  width: 0;
  height: 0;
  border-left: 4px solid var(--on-dark-soft);
  border-top: 3px solid transparent;
  border-bottom: 3px solid transparent;
  transition: transform 150ms ease-out;
}
.summary[open] > summary::before { transform: rotate(90deg); }
.summary pre {
  margin: 0;
  padding: 0 20px 16px 32px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  color: var(--on-dark-soft);
  white-space: pre-wrap;
  word-break: break-word;
}

/* ---- step hint / error banner / result ---- */
.step-hint {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 1px 4px;
  color: var(--muted);
  font-size: 12px;
}
.step-hint::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--teal);
  flex: none;
}

.error-banner {
  background: rgba(198, 69, 69, 0.06);
  border: 1px solid rgba(198, 69, 69, 0.25);
  border-radius: var(--radius-btn);
  padding: 10px 16px;
  font-size: 13px;
  color: var(--error);
  word-break: break-word;
}
.warn-banner {
  background: rgba(232, 165, 90, 0.08);
  border: 1px solid rgba(232, 165, 90, 0.4);
  border-radius: var(--radius-btn);
  padding: 10px 16px;
  font-size: 13px;
  color: #8a5a1e;
  word-break: break-word;
}

/* ---- post materials (发帖素材:文案 + 截图, cream 卡) ---- */
.post-materials {
  background: var(--surface-card);
  border: 1px solid var(--hairline-soft);
  border-radius: var(--radius-card);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.pm-title {
  font-family: var(--font-display);
  font-size: 16px;
  color: var(--ink);
}
.pm-copy { position: relative; }
.pm-copy pre {
  margin: 0;
  background: var(--canvas);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-btn);
  padding: 12px 14px;
  padding-right: 96px;
  font-size: 13px;
  line-height: 1.65;
  color: var(--body);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 200px;
  overflow-y: auto;
}
.pm-copy-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: var(--canvas);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-btn);
  font-family: inherit;
  font-size: 12px;
  color: var(--body);
  padding: 4px 12px;
  cursor: pointer;
  transition: color 150ms ease-out, border-color 150ms ease-out;
}
.pm-copy-btn:hover { color: var(--primary-active); border-color: var(--primary); }
.pm-images {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.pm-figure { margin: 0; }
.pm-figure img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: var(--radius-btn);
  border: 1px solid var(--hairline);
  display: block;
}
.pm-figure figcaption {
  margin-top: 6px;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
}
.pm-figure.pm-figure-failed img { display: none; }
.pm-figure.pm-figure-failed figcaption::after {
  content: "(加载失败)";
  display: block;
  color: var(--error);
}
.pm-hint { font-size: 12px; color: var(--muted); }

.result-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px 4px;
  font-size: 13px;
}
.result-label { color: var(--muted); font-weight: 500; }
.result-link { color: var(--primary); text-decoration: none; }
.result-link:hover { text-decoration: underline; }
.result-cost {
  margin-left: auto;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

/* ---- input bar (cream, hairline top) ---- */
.input-bar {
  flex: none;
  display: flex;
  gap: 10px;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--hairline);
  background: var(--canvas);
}
#cmd {
  flex: 1;
  min-width: 0;
  background: var(--canvas);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-btn);
  color: var(--ink);
  font-family: inherit;
  font-size: 14px;
  padding: 0 14px;
  height: 40px;
  outline: none;
  transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
}
#cmd::placeholder { color: var(--muted-soft); }
#cmd:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(204, 120, 92, 0.15);
}
#cmd:disabled { opacity: 0.55; }
.send-btn {
  flex: none;
  background: var(--primary);
  color: var(--on-primary);
  border: none;
  border-radius: var(--radius-btn);
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  padding: 0 24px;
  height: 40px;
  cursor: pointer;
  transition: background-color 150ms ease-out;
}
.send-btn:hover:not(:disabled) { background: var(--primary-active); }
.send-btn:disabled { background: var(--primary-disabled); color: var(--muted); cursor: not-allowed; }

/* ---- floating back-to-bottom (button-secondary) ---- */
.back-to-bottom {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 84px;
  background: var(--canvas);
  color: var(--body);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-btn);
  font-family: inherit;
  font-size: 12px;
  font-weight: 500;
  padding: 7px 16px;
  box-shadow: var(--shadow-soft);
  cursor: pointer;
  z-index: 20;
  transition: color 150ms ease-out;
}
.back-to-bottom:hover { color: var(--ink); }
.back-to-bottom[hidden] { display: none; }

/* ---- toast (cream card, error text) ---- */
.toast {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--canvas);
  border: 1px solid rgba(198, 69, 69, 0.35);
  color: var(--error);
  border-radius: var(--radius-btn);
  box-shadow: var(--shadow-soft);
  padding: 10px 16px;
  font-size: 13px;
  max-width: min(480px, calc(100vw - 32px));
  z-index: 30;
  transition: opacity 150ms ease-out;
}
.toast[hidden] { display: none; }

/* ---- animations (no glow, opacity only) ---- */
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
@keyframes blink {
  50% { opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .agent-card.running .status-light,
  .status-dot.running { animation: none; }
  .caret { animation: none; opacity: 0.6; }
}

/* ---- mobile (< 768px, per DESIGN.md) ---- */
@media (max-width: 768px) {
  .brand { height: 56px; padding: 0 16px; }
  .brand-title { font-size: 20px; }
  .thread { padding: 24px 12px 20px; gap: 14px; }
  .empty { padding: 64px 12px 32px; }
  .empty-title { font-size: 28px; letter-spacing: -0.3px; }
  .round { gap: 10px; }
  .agent-head { padding: 12px 16px; }
  .agent-stream { margin: 0 16px 16px; padding: 10px 14px; }
  .summary > summary { padding: 9px 16px; }
  .summary pre { padding: 0 16px 14px 28px; }
  .input-bar { padding: 10px; }
  .back-to-bottom { bottom: 76px; }
}
</style>

</head>
<body>

<header class="brand">
  <div class="brand-title">小红书测试题生成台</div>
  <div class="brand-status">
    <span class="status-dot" id="statusDot"></span>
    <span class="status-text" id="statusText">就绪</span>
  </div>
</header>

<main id="thread" class="thread" aria-live="polite">
  <div id="empty" class="empty">
    <p class="empty-title">输入指令,开始生成测试题</p>
    <p class="empty-sub">点击示例指令,或直接输入:</p>
    <div class="chips">
      <button class="chip" data-fill="做一个人格阴影测试,15题">做一个人格阴影测试,15题</button>
      <button class="chip" data-fill="做一个恋爱人格测试">做一个恋爱人格测试</button>
      <button class="chip" data-fill="做一个MBTI职场测试,20题">做一个MBTI职场测试,20题</button>
    </div>
  </div>
</main>

<button id="backToBottom" class="back-to-bottom" hidden>回到底部</button>

<footer class="input-bar">
  <input id="cmd" type="text" placeholder="输入指令,例如:做一个人格阴影测试,15题" autocomplete="off">
  <button id="send" class="send-btn">生成</button>
</footer>

<div id="toast" class="toast" hidden></div>

<script>
(function () {
  "use strict";

  var thread = document.getElementById("thread");
  var cmd = document.getElementById("cmd");
  var sendBtn = document.getElementById("send");
  var backBtn = document.getElementById("backToBottom");
  var statusDot = document.getElementById("statusDot");
  var statusText = document.getElementById("statusText");
  var toastEl = document.getElementById("toast");

  var AGENTS = [
    { key: "navigator", label: "领航员 Navigator" },
    { key: "generator", label: "生成器 Generator" },
    { key: "packager", label: "包装师 Packager" },
    { key: "reviewer", label: "评审员 Reviewer" },
    { key: "auditor", label: "审核员 Auditor" },
    { key: "publisher", label: "发布器 Publisher" }
  ];

  var running = false;
  var stopped = false;   // round terminated (done/error/failed); later frames are ignored
  var cards = {};        // agent key -> {card, stream, textNode, caret, details, pre, elapsed}
  var lastCard = null;   // element of the most recently started agent
  var startedAt = {};    // agent key -> timestamp
  var timer = null;

  /* ---------- helpers ---------- */

  function fmtElapsed(ms) {
    var s = Math.floor(ms / 1000);
    if (s < 60) return s + "s";
    return Math.floor(s / 60) + "m " + (s % 60) + "s";
  }

  function nearBottom() {
    return thread.scrollHeight - thread.scrollTop - thread.clientHeight <= 120;
  }

  function autoScroll() {
    if (nearBottom()) thread.scrollTop = thread.scrollHeight;
  }

  thread.addEventListener("scroll", function () {
    backBtn.hidden = nearBottom();
  });

  backBtn.addEventListener("click", function () {
    thread.scrollTop = thread.scrollHeight;
  });

  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    toastEl.style.opacity = "1";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.style.opacity = "0";
      setTimeout(function () { toastEl.hidden = true; }, 160);
    }, 4200);
  }

  function setBusy(b) {
    running = b;
    sendBtn.disabled = b;
    cmd.disabled = b;
    if (b) {
      statusDot.classList.add("running");
      statusText.textContent = "生成中";
    } else {
      statusDot.classList.remove("running");
      statusText.textContent = "就绪";
    }
  }

  /* ---------- rendering ---------- */

  function hideEmpty() {
    var e = document.getElementById("empty");
    if (e) e.remove();
  }

  function renderUserBubble(text) {
    hideEmpty();
    var wrap = document.createElement("div");
    wrap.className = "msg-user";
    var bubble = document.createElement("div");
    bubble.className = "bubble-user";
    bubble.textContent = text;
    wrap.appendChild(bubble);
    thread.appendChild(wrap);
  }

  function renderRound() {
    var round = document.createElement("div");
    round.className = "round";
    thread.appendChild(round);
    cards = {};
    lastCard = null;
    startedAt = {};
  }

  // 卡片按需创建:agent_start 事件到达(该 agent 开始思考)时才出现
  function createCard(agent) {
    var a = null;
    for (var i = 0; i < AGENTS.length; i++) {
      if (AGENTS[i].key === agent) { a = AGENTS[i]; break; }
    }
    if (!a) return null;

    var card = document.createElement("div");
    card.className = "agent-card";
    card.dataset.agent = a.key;

    var head = document.createElement("div");
    head.className = "agent-head";
    var light = document.createElement("span");
    light.className = "status-light";
    var name = document.createElement("span");
    name.className = "agent-name";
    name.textContent = a.label;
    var elapsed = document.createElement("span");
    elapsed.className = "agent-elapsed";
    elapsed.textContent = "—";
    head.appendChild(light);
    head.appendChild(name);
    head.appendChild(elapsed);

    var stream = document.createElement("div");
    stream.className = "agent-stream";
    var textNode = document.createTextNode("");
    stream.appendChild(textNode);

    var details = document.createElement("details");
    details.className = "summary";
    var sum = document.createElement("summary");
    sum.textContent = "结果摘要";
    var pre = document.createElement("pre");
    details.appendChild(sum);
    details.appendChild(pre);

    card.appendChild(head);
    card.appendChild(stream);
    card.appendChild(details);

    var round = thread.querySelector(".round:last-child");
    if (round) round.appendChild(card); else thread.appendChild(card);

    cards[a.key] = { card: card, stream: stream, textNode: textNode, caret: null, details: details, pre: pre, elapsed: elapsed };
    return cards[a.key];
  }

  /* ---------- agent lifecycle ---------- */

  function startTimer() {
    if (timer) return;
    timer = setInterval(function () {
      var anyRunning = false;
      for (var key in cards) {
        var c = cards[key];
        if (c.card.classList.contains("running")) {
          anyRunning = true;
          c.elapsed.textContent = fmtElapsed(Date.now() - (startedAt[key] || Date.now()));
        }
      }
      if (!anyRunning) {
        clearInterval(timer);
        timer = null;
      }
    }, 500);
  }

  function activate(agent) {
    var c = cards[agent];
    if (!c) return;
    lastCard = c.card;
    c.card.classList.add("running");
    c.card.classList.add("has-stream");
    startedAt[agent] = Date.now();
    c.elapsed.textContent = "0s";
    if (!c.caret) {
      var caret = document.createElement("span");
      caret.className = "caret";
      c.stream.appendChild(caret);
      c.caret = caret;
    }
    startTimer();
    autoScroll();
  }

  function appendToken(agent, text) {
    var c = cards[agent];
    if (!c || !text) return;
    c.card.classList.add("has-stream");
    c.textNode.data += text;
    autoScroll();
  }

  function finish(agent, summary) {
    var c = cards[agent];
    if (!c) return;
    c.card.classList.remove("running");
    c.card.classList.add("done");
    c.elapsed.textContent = fmtElapsed(Date.now() - (startedAt[agent] || Date.now()));
    if (c.caret) { c.caret.remove(); c.caret = null; }
    if (summary && Object.keys(summary).length > 0) {
      c.pre.textContent = JSON.stringify(summary, null, 2);
    }
    autoScroll();
  }

  function failCard(c) {
    if (!c) return;
    c.card.classList.remove("running");
    c.card.classList.add("failed");
    if (c.caret) { c.caret.remove(); c.caret = null; }
    c.elapsed.textContent = "—";
  }

  function addStep(message) {
    var row = document.createElement("div");
    row.className = "step-hint";
    var span = document.createElement("span");
    span.textContent = message || "";
    row.appendChild(span);
    if (lastCard && lastCard.parentNode) {
      lastCard.parentNode.insertBefore(row, lastCard.nextSibling);
    } else {
      thread.appendChild(row);
    }
    autoScroll();
  }

  function showError(message) {
    var banner = document.createElement("div");
    banner.className = "error-banner";
    banner.textContent = message || "生成失败";
    if (lastCard && lastCard.parentNode) {
      lastCard.parentNode.insertBefore(banner, lastCard.nextSibling);
    } else {
      thread.appendChild(banner);
    }
    autoScroll();
  }

  function midStreamError(message) {
    stopped = true;
    var c = lastCard ? cards[lastCard.dataset.agent] : null;
    if (c) failCard(c);
    showError(message);
    setBusy(false);
  }

  function roundFailed(message) {
    stopped = true;
    var round = thread.querySelector(".round");
    if (round) round.remove();
    showToast(message);
    setBusy(false);
  }

  function safeUrl(raw) {
    if (!raw) return "";
    try {
      var u = new URL(raw, window.location.href);
      if (u.protocol === "http:" || u.protocol === "https:") return u.href;
    } catch (e) { /* fall through */ }
    return "";
  }

  function copyText(text) {
    function ok() { showToast("已复制文案"); }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(ok, function () { fallbackCopy(text, ok); });
    } else {
      fallbackCopy(text, ok);
    }
  }

  function fallbackCopy(text, ok) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); ok(); } catch (e) { /* 复制失败,静默 */ }
    ta.remove();
  }

  function renderMaterials(m) {
    var box = document.createElement("div");
    box.className = "post-materials";
    var title = document.createElement("div");
    title.className = "pm-title";
    title.textContent = "发帖素材";
    box.appendChild(title);

    if (m.copy) {
      var copyWrap = document.createElement("div");
      copyWrap.className = "pm-copy";
      var pre = document.createElement("pre");
      pre.textContent = m.copy;
      copyWrap.appendChild(pre);
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "pm-copy-btn";
      btn.textContent = "复制文案";
      btn.addEventListener("click", function () { copyText(m.copy); });
      copyWrap.appendChild(btn);
      box.appendChild(copyWrap);
    }

    var imgs = m.images || [];
    if (imgs.length) {
      var grid = document.createElement("div");
      grid.className = "pm-images";
      imgs.forEach(function (im) {
        var fig = document.createElement("figure");
        fig.className = "pm-figure";
        var img = document.createElement("img");
        img.src = safeUrl(im.url);
        img.alt = im.label || "截图";
        img.addEventListener("error", function () {
          fig.classList.add("pm-figure-failed");
        });
        var cap = document.createElement("figcaption");
        cap.textContent = im.label || "";
        fig.appendChild(img);
        fig.appendChild(cap);
        grid.appendChild(fig);
      });
      box.appendChild(grid);
      var hint = document.createElement("div");
      hint.className = "pm-hint";
      hint.textContent = "刚部署完成,若链接或图片打不开,请稍候几分钟再试";
      box.appendChild(hint);
    }

    thread.appendChild(box);
    autoScroll();
  }

  function finishRound(url, cost, rejected, reply, postMaterials, auditWarning) {
    stopped = true;
    url = safeUrl(url);   // 只允许 http/https,否则走无链接分支
    if (rejected) {
      // navigator 拒绝(题量超限/无关输入):不显示链接,展示拒绝说明
      var rowR = document.createElement("div");
      rowR.className = "result-row";
      var labelR = document.createElement("span");
      labelR.className = "result-label";
      labelR.textContent = "本轮未生成测试题";
      rowR.appendChild(labelR);
      var why = document.createElement("span");
      why.textContent = reply || "";
      why.style.wordBreak = "break-word";
      rowR.appendChild(why);
      thread.appendChild(rowR);
      setBusy(false);
      autoScroll();
      return;
    }
    // ① 发帖素材层:文案(可复制)+ 截图预览
    if (postMaterials && (postMaterials.copy || (postMaterials.images && postMaterials.images.length))) {
      renderMaterials(postMaterials);
    }
    // 审核未通过警示(已放行)
    if (auditWarning) {
      var warn = document.createElement("div");
      warn.className = "warn-banner";
      warn.textContent = "审核提示:" + auditWarning;
      thread.appendChild(warn);
    }
    // ② 测试题跳转层
    var row = document.createElement("div");
    row.className = "result-row";
    var label = document.createElement("span");
    label.className = "result-label";
    label.textContent = "完成";
    row.appendChild(label);
    if (url) {
      var link = document.createElement("a");
      link.className = "result-link";
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "查看生成结果";
      row.appendChild(link);
    } else {
      var none = document.createElement("span");
      none.className = "result-link";
      none.textContent = "未获取到链接";
      row.appendChild(none);
    }
    var costSpan = document.createElement("span");
    costSpan.className = "result-cost";
    costSpan.textContent = "成本 ¥" + Number(cost || 0).toFixed(4);
    row.appendChild(costSpan);
    thread.appendChild(row);
    setBusy(false);
    autoScroll();
  }

  /* ---------- SSE ---------- */

  function dispatch(frame) {
    if (stopped) return false;   // 终止后的迟到帧一律忽略
    var lines = frame.split("\n");
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (line.indexOf("data:") !== 0) continue;
      var payload = line.slice(5).trim();
      if (!payload) continue;
      var ev;
      try { ev = JSON.parse(payload); } catch (e) { continue; }
      switch (ev.event) {
        case "agent_start":
          // 重做轮同名 agent 再次 start:新建卡片,旧卡保持 done(每轮可见)
          if (createCard(ev.agent)) activate(ev.agent);
          break;
        case "token": appendToken(ev.agent, ev.text); break;
        case "agent_done": finish(ev.agent, ev.summary); break;
        case "step": addStep(ev.message); break;
        case "done": finishRound(ev.url, ev.cost, ev.rejected, ev.reply, ev.post_materials, ev.audit_warning); return true;
        case "error": midStreamError(ev.message); return true;
      }
    }
    return false;
  }

  async function consumeStream(body) {
    var reader = body.getReader();
    var decoder = new TextDecoder();
    var buf = "";
    var terminal = false;   // 已看到 done 或 error 帧
    var res;
    for (;;) {
      res = await reader.read();
      if (res.done) break;
      buf += decoder.decode(res.value, { stream: true }).replace(/\r\n/g, "\n");
      var idx;
      while ((idx = buf.indexOf("\n\n")) !== -1) {
        var frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        terminal = dispatch(frame) || terminal;
        if (stopped) {
          try { reader.cancel(); } catch (e) { /* 流已死,忽略 */ }
          break;
        }
      }
      if (stopped) break;
    }
    if (res.done && buf.trim()) {
      // 最后一段没有 \n\n 结尾的残留帧
      buf = buf.replace(/\r\n/g, "\n");
      terminal = dispatch(buf) || terminal;
    }
    if (!terminal && !stopped) {
      // 流正常关闭但没有终止帧:中止本轮,不许残留 running 状态
      midStreamError("连接提前结束");
    }
  }

  /* ---------- send ---------- */

  async function send() {
    var text = cmd.value.trim();
    if (!text || running) return;
    stopped = false;   // 新回合开始
    renderUserBubble(text);
    renderRound();
    setBusy(true);
    cmd.value = "";
    try {
      var res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      if (!res.ok) {
        // 429/400 等错误以 JSON 返回(非 SSE)
        var msg = "请求失败 (" + res.status + ")";
        try {
          var data = await res.json();
          if (data && data.error) msg = data.error;
        } catch (e) { /* keep default */ }
        roundFailed(msg);
        return;
      }
      await consumeStream(res.body);
      setBusy(false);
    } catch (err) {
      // 流中途断开:保留已流式呈现的内容,红牌 + 错误条
      midStreamError("网络错误:连接已断开");
    }
  }

  cmd.addEventListener("keydown", function (e) {
    if (e.key === "Enter") send();
  });
  sendBtn.addEventListener("click", send);

  document.querySelectorAll(".chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      cmd.value = chip.dataset.fill || chip.textContent;
      cmd.focus();
    });
  });

  backBtn.hidden = true;
})();
</script>
</body>
</html>
