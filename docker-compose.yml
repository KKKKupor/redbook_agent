version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: redbook_pg
    environment:
      POSTGRES_USER: redbook
      POSTGRES_PASSWORD: redbook123
      POSTGRES_DB: redbook_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
